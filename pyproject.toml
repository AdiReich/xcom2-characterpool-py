[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcom2-characterpool"
version = "2.0.0"
description = "Command-line tools for XCOM 2 character pools"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
xcom2-characterpool = "xcom2_characterpool_py.cli:main"

[tool.setuptools.packages.find]
include = ["xcom2_characterpool_py*"]

[tool.setuptools.package-data]
xcom2_characterpool_py = ["data/Files/*", "data/Files/**/*"]